apiVersion: apps/v1
kind: Deployment
metadata:
  name: doschennikov-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: doschennikov-app
  template:
    metadata:
      labels:
        app: doschennikov-app
    spec:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: doschennikov-app
      initContainers:
        - name: wait-for-db
          image: postgres:15
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: app
          image: ghcr.io/fymious/kubernetes-intro:sha-a1a8834
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5527
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5527
            initialDelaySeconds: 5
            periodSeconds: 5
